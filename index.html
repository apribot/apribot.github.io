<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CPU PassMark Table</title>
    <style>
        :root {
            color-scheme: dark;
            --ink: #e6eeea;
            --muted: #9aaca5;
            --line: #354642;
            --paper: #111a19;
            --surface: #1a2523;
            --surface-raised: #202e2b;
            --surface-striped: #1c2927;
            --accent: #6fc4a5;
            --accent-wash: #243d35;
            --highlight: #e7b95d;
        }

        * { box-sizing: border-box; }

        body {
            min-width: 320px;
            margin: 0;
            background-color: var(--paper);
            background-image: radial-gradient(#273532 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            color: var(--ink);
            font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
        }

        main {
            width: min(100% - 40px, 960px);
            margin: clamp(36px, 8vh, 88px) auto;
            animation: arrive 420ms ease-out both;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 750;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(2rem, 6vw, 3.25rem);
            font-weight: 500;
            line-height: 1.08;
        }

        .intro {
            margin: 12px 0 30px;
            color: var(--muted);
            font-size: 0.98rem;
        }

        .table-shell {
            overflow: hidden;
            border: 1px solid var(--line);
            border-top: 3px solid var(--highlight);
            background: var(--surface);
            box-shadow: 0 14px 38px rgb(0 0 0 / 24%);
        }

        .search-control {
            display: grid;
            width: min(100%, 380px);
            gap: 7px;
            margin-bottom: 14px;
        }

        .search-control label {
            color: var(--ink);
            font-size: 0.75rem;
            font-weight: 700;
        }

        .search-control input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--line);
            border-radius: 2px;
            background: var(--surface);
            color: var(--ink);
            font: inherit;
        }

        .search-control input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .table-scroll { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        thead { background: var(--surface-raised); }

        th, td {
            min-width: 150px;
            padding: 0 20px;
            border-top: 1px solid var(--line);
        }

        th.pin-column, td.pin-column {
            width: 56px;
            min-width: 56px;
            padding: 0 8px;
            text-align: center;
        }

        th {
            height: 52px;
            color: #c7d6d0;
            font-size: 0.73rem;
            font-weight: 750;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        th[aria-sort="ascending"], th[aria-sort="descending"] { color: var(--accent); }

        .sort-button {
            display: inline-flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border: 0;
            background: transparent;
            color: inherit;
            cursor: pointer;
            font: inherit;
            letter-spacing: inherit;
            text-align: left;
            text-transform: inherit;
        }

        .sort-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        .sort-indicator { color: var(--accent); font-size: 0.95rem; }

        td {
            height: 54px;
            border-top: 1px solid #2d3b37;
            font-size: 0.94rem;
        }

        .pin-button {
            width: 36px;
            height: 36px;
            border: 1px solid transparent;
            border-radius: 2px;
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            font: inherit;
            font-size: 1rem;
        }

        .pin-button:hover, .pin-button[aria-pressed="true"] {
            border-color: var(--accent);
            background: var(--accent-wash);
            color: var(--accent);
        }

        .pin-button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        .empty-state { color: var(--muted); }

        tbody tr { animation: row-arrive 300ms ease-out both; }
        tbody tr:nth-child(even) { background: var(--surface-striped); }
        tbody tr.pinned-row { background: var(--accent-wash); }
        tbody tr.pinned-row { box-shadow: inset 3px 0 var(--accent); }

        #status {
            min-height: 24px;
            margin: 14px 2px 0;
            color: var(--muted);
            font-size: 0.82rem;
        }

        #status[data-error="true"] { color: #ff9588; }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes row-arrive {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media (max-width: 560px) {
            main { width: min(100% - 28px, 960px); margin-top: 36px; }
            .intro { margin-bottom: 22px; }
            th, td { min-width: 132px; padding-right: 16px; padding-left: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main>
        <h1>CPU PassMark Scores</h1>
        <div class="search-control">
            <input id="table-search" type="search" placeholder="Type to filter rows">
        </div>
        <section class="table-shell" aria-label="CSV data">
            <div class="table-scroll" id="table-container" aria-live="polite">
                <p style="padding: 20px; margin: 0; color: var(--muted);">Loading data...</p>
            </div>
        </section>
        <p id="status" role="status"></p>
    </main>

    <script>
        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;
            const source = text.replace(/^\uFEFF/, "");

            for (let index = 0; index < source.length; index += 1) {
                const character = source[index];
                const nextCharacter = source[index + 1];

                if (character === '"') {
                    if (inQuotes && nextCharacter === '"') {
                        field += '"';
                        index += 1;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (character === "," && !inQuotes) {
                    row.push(field);
                    field = "";
                } else if ((character === "\n" || character === "\r") && !inQuotes) {
                    if (character === "\r" && nextCharacter === "\n") index += 1;
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else {
                    field += character;
                }
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }

            return rows.filter((cells) => cells.some((cell) => cell.trim() !== ""));
        }

        function compareValues(first, second) {
            const firstNumber = Number(first);
            const secondNumber = Number(second);

            if (first.trim() !== "" && second.trim() !== "" &&
                Number.isFinite(firstNumber) && Number.isFinite(secondNumber)) {
                return firstNumber - secondNumber;
            }

            return first.localeCompare(second, undefined, { numeric: true, sensitivity: "base" });
        }

        class CsvTable {
            constructor(container, status, searchInput, source) {
                this.container = container;
                this.status = status;
                this.searchInput = searchInput;
                this.source = source;
                this.columns = [];
                this.rows = [];
                this.sort = null;
                this.pinnedRowIndexes = new Set();

                this.searchInput.addEventListener("input", () => {
                    this.render();
                    this.updateStatus();
                });

                this.container.addEventListener("click", (event) => {
                    const pinButton = event.target.closest("[data-pin-row]");
                    if (pinButton) {
                        this.togglePinnedRow(Number(pinButton.dataset.pinRow));
                        return;
                    }

                    const button = event.target.closest("[data-column]");
                    if (button) {
                        this.sortBy(Number(button.dataset.column));
                    }
                });
            }

            async load() {
                try {
                    const response = await fetch(this.source);
                    if (!response.ok) throw new Error(`Could not load ${this.source} (${response.status})`);

                    const [header = [], ...rows] = parseCsv(await response.text());
                    if (header.length === 0) throw new Error("The CSV file has no header row.");

                    this.columns = header;
                    this.rows = rows.map((cells, index) => ({
                        cells: this.columns.map((_, columnIndex) => cells[columnIndex] ?? ""),
                        index
                    }));
                    this.render();
                    this.updateStatus();
                } catch (error) {
                    this.container.textContent = "The data could not be loaded.";
                    this.status.dataset.error = "true";
                    this.status.textContent = error.message;
                }
            }

            sortBy(columnIndex) {
                const direction = this.sort?.columnIndex === columnIndex && this.sort.direction === "ascending"
                    ? "descending"
                    : "ascending";
                this.sort = { columnIndex, direction };
                this.render();
            }

            togglePinnedRow(rowIndex) {
                if (this.pinnedRowIndexes.has(rowIndex)) {
                    this.pinnedRowIndexes.delete(rowIndex);
                } else {
                    this.pinnedRowIndexes.add(rowIndex);
                }
                this.render();
                this.updateStatus();
            }

            getFilteredRows() {
                const query = this.searchInput.value.trim().toLocaleLowerCase();
                if (!query) return this.rows;
                return this.rows.filter(({ cells, index }) =>
                    this.pinnedRowIndexes.has(index) ||
                    cells.some((value) => value.toLocaleLowerCase().includes(query))
                );
            }

            getVisibleRows() {
                const rows = this.getFilteredRows();
                const sortedRows = this.sort
                    ? [...rows].sort((first, second) => {
                        const multiplier = this.sort.direction === "ascending" ? 1 : -1;
                        const result = compareValues(
                            first.cells[this.sort.columnIndex],
                            second.cells[this.sort.columnIndex]
                        );
                        return result === 0 ? first.index - second.index : result * multiplier;
                    })
                    : rows;

                if (this.pinnedRowIndexes.size === 0) return sortedRows;

                const rowsByIndex = new Map(sortedRows.map((row) => [row.index, row]));
                const pinnedRows = this.sort
                    ? sortedRows.filter(({ index }) => this.pinnedRowIndexes.has(index))
                    : [...this.pinnedRowIndexes]
                        .map((index) => rowsByIndex.get(index))
                        .filter(Boolean);
                return [
                    ...pinnedRows,
                    ...sortedRows.filter(({ index }) => !this.pinnedRowIndexes.has(index))
                ];
            }

            updateStatus() {
                const query = this.searchInput.value.trim();
                const matchCount = query
                    ? this.rows.filter(({ cells }) =>
                        cells.some((value) => value.toLocaleLowerCase().includes(query.toLocaleLowerCase()))
                    ).length
                    : this.rows.length;
                const visibleCount = this.getVisibleRows().length;
                const pinnedSummary = this.pinnedRowIndexes.size > 0
                    ? ` · ${this.pinnedRowIndexes.size} pinned`
                    : "";
                this.status.textContent = query
                    ? `${matchCount} matches · ${visibleCount} rows shown${pinnedSummary} · ${this.columns.length} columns`
                    : `${visibleCount} rows · ${this.columns.length} columns${pinnedSummary}`;
            }

            render() {
                const table = document.createElement("table");
                const head = table.createTHead().insertRow();
                const pinHeading = document.createElement("th");
                pinHeading.className = "pin-column";
                pinHeading.scope = "col";
                pinHeading.textContent = "Pin";
                head.append(pinHeading);

                this.columns.forEach((column, columnIndex) => {
                    const heading = document.createElement("th");
                    const button = document.createElement("button");
                    const indicator = document.createElement("span");
                    const isActive = this.sort?.columnIndex === columnIndex;

                    heading.scope = "col";
                    heading.setAttribute("aria-sort", isActive ? this.sort.direction : "none");
                    button.type = "button";
                    button.className = "sort-button";
                    button.dataset.column = columnIndex;
                    button.append(document.createTextNode(column));
                    indicator.className = "sort-indicator";
                    indicator.setAttribute("aria-hidden", "true");
                    indicator.textContent = isActive ? (this.sort.direction === "ascending" ? "↑" : "↓") : "↕";
                    button.append(indicator);
                    heading.append(button);
                    head.append(heading);
                });

                const body = table.createTBody();
                const visibleRows = this.getVisibleRows();
                if (visibleRows.length === 0) {
                    const row = body.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = this.columns.length + 1;
                    cell.className = "empty-state";
                    cell.textContent = "No matching rows";
                }

                visibleRows.forEach(({ cells, index }) => {
                    const row = body.insertRow();
                    row.dataset.rowIndex = index;
                    const isPinned = this.pinnedRowIndexes.has(index);
                    if (isPinned) row.classList.add("pinned-row");

                    const pinCell = row.insertCell();
                    const pinButton = document.createElement("button");
                    pinCell.className = "pin-column";
                    pinButton.type = "button";
                    pinButton.className = "pin-button";
                    pinButton.dataset.pinRow = index;
                    pinButton.setAttribute("aria-pressed", String(isPinned));
                    pinButton.setAttribute("aria-label", `${isPinned ? "Unpin" : "Pin"} ${cells[0] || "row"}`);
                    pinButton.title = isPinned ? "Unpin row" : "Pin row to top";
                    pinButton.textContent = "☆";
                    pinCell.append(pinButton);

                    cells.forEach((value) => {
                        const cell = row.insertCell();
                        cell.textContent = value;
                    });
                });

                this.container.replaceChildren(table);
            }
        }

        new CsvTable(
            document.querySelector("#table-container"),
            document.querySelector("#status"),
            document.querySelector("#table-search"),
            "cpus.csv"
        ).load();
    </script>
</body>
</html>
